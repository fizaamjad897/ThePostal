# Production stack for a single small VM (an EC2 t3.micro or equivalent).
#
# MongoDB is deliberately NOT here — it alone would want most of a 1 GB box, so
# it lives on Atlas M0 (free, permanent).
#
# Redis IS here, and that is a measured decision rather than a default. A BullMQ
# worker issues roughly 130 commands a minute while completely idle, which is
# about 5.7 million a month — eleven times the 500k that hosted free tiers
# allow. Redis itself uses about 9 MB resident, so running it alongside the app
# costs almost nothing and removes both the quota and the network hop.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  # Terminates TLS and provisions Let's Encrypt certificates automatically.
  # Nothing else is published to the internet directly.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
      # `:-` substitutes when the variable is unset OR empty, which is what makes
      # leaving MAIL_UI_DOMAIN blank work: Caddy's own `{$VAR:default}` only
      # applies when a variable is absent, and compose always passes it through.
      # A .localhost name keeps the site block valid and is served by Caddy's
      # internal CA, so no public certificate is ever requested for it.
      MAIL_UI_DOMAIN: ${MAIL_UI_DOMAIN:-mailpit.localhost}
    depends_on:
      - server

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly` so queued deliveries survive a restart — the whole reason for
    # using Redis over the in-process queue. `noeviction` because silently
    # dropping a queued message to free memory would lose mail.
    command: >
      redis-server --appendonly yes
      --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - '4000'
    ports:
      # The inbound SMTP listener is the one port that must be reachable
      # directly — SMTP is not HTTP and cannot be proxied by Caddy.
      - '2525:2525'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Local mail sink, so the demo works without sending to real addresses.
  # Swap SMTP_RELAY_HOST for a provider (Resend, SendGrid) to deliver for real.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    expose:
      - '1025'
      - '8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Mailpit's UI shows every message it has received. Without auth, anyone
      # who finds the URL reads all of it — set these or do not expose it.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?set MAILPIT_UI_AUTH as user:bcrypt-hash}
      MP_MAX_MESSAGES: 500

volumes:
  caddy-data:
  caddy-config:
  redis-data:
